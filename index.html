<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="shortcut icon" href="./Untitled.png" type="image/x-icon">
</head>

<body>
    <div class="container">
        <h1>QR CODE GENERTOR</h1>
        <div class="input" id="box">
            <input type="url" id="input_url" placeholder="URL">
            <button type="button" id="btn">Genertor</button>
            <p id="massege"></p>
            <div class="qr_box" id="qrbox"></div>
            <button type="button" id="download" class="download" style="display: none;">Download</button>
        </div>
    </div>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(266deg, rgb(255, 255, 255), rgb(157, 157, 157), rgb(103, 103, 103));
            flex-direction: column;
            min-height: 100vh;
            display: grid;
            grid-template-columns: repea t(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .container {
            padding: 30px 30px;
            border: 1px solid rgb(126, 126, 126);
            min-height: 500px;
            min-height: 400px;
            border-radius: 10px;
            box-shadow: 4px 6px 10px black;
        }

        .container h1 {
            text-align: center;
            margin-bottom: 100px;
            font-size: 45px;
            font-weight: bold;
            text-shadow: 1px 3px 5px black;
            letter-spacing: 2px;
        }

        .container #input_url {
            margin-bottom: 20px;
            height: 40px;
            width: 350px;
            border-radius: 15px;
            border: none;
            font-size: large;
            font-weight: 700;
            padding: 10px 20px;
            box-shadow: 1px 3px 5px black;
            background: transparent;
            backdrop-filter: blur(5px);
        }

        .container #input_url::placeholder {
            color: rgb(38, 38, 38);
            letter-spacing: 2px;
        }

        .container #btn,
        .container .download {
            padding: 15px 10px;
            width: 30%;
            border: none;
            border-radius: 15px;
            font-size: large;
            font-weight: 800;
            background-color: rgb(43, 255, 0);
            margin-left: 30px;

        }

        .container #btn:hover,
        .container .download:hover {
            background-color: rgb(47, 140, 0);
            color: white;
            transition: .3s;
        }

        .container #btn:active,
        .container .download:active {
            background-color: rgb(27, 79, 1);
            color: white;
            transform: scale(1.1);
            transition: .1s;
        }

        .container #massege {

            font-size: medium;
            font-weight: 400;
            letter-spacing: 1.5px;

        }

        .container .qr_box {

            width: 270px;
            min-height: 270px;
            margin: 20px 10px;
            padding: 15px;
            background-color: #fff;
            border: 2px solid #ddd;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 1px 5px 20px rgba(0, 0, 0, .15);

        }

        #qrbox img,
        #qrbox canvas {
            width: 250px;
            height: 250px;
            border-radius: 10px;
        }

        #qrbox img,
        #qrbox canvas {
            animation: showQR .4s ease;
        }

        @keyframes showQR {
            from {
                transform: scale(.8);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script src="./script.js"></script>
</body>

</html>
